<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>つみあげ</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="つみあげ">
<meta name="theme-color" content="#0F1E24">
<link rel="apple-touch-icon" sizes="180x180" href="icon.png">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%230F1E24'/><rect x='5' y='20' width='22' height='5' fill='%23F2A03D'/><rect x='5' y='13' width='14' height='5' fill='%235FC2A3'/><rect x='5' y='6' width='8' height='5' fill='%237FA9D6'/></svg>">

<style>
  :root{
    --ground:#0F1E24;
    --panel:#172E37;
    --panel-hi:#1E3A45;
    --line:#294A57;
    --bone:#E9EDE9;
    --muted:#7E9AA5;
    --danger:#E0736A;
    --radius:14px;
    --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,monospace;
    --jp:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
  }

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}

  html,body{margin:0;padding:0;}

  body{
    background:var(--ground);
    color:var(--bone);
    font-family:var(--jp);
    font-size:16px;
    line-height:1.5;
    min-height:100svh;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    -webkit-font-smoothing:antialiased;
    overscroll-behavior-y:none;
  }

  .wrap{max-width:560px;margin:0 auto;padding:20px 16px 140px;}

  /* ---- 見出し ---- */
  .masthead{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:18px;}
  .mark{
    font-family:var(--mono);
    font-size:13px;letter-spacing:.22em;text-transform:uppercase;
    color:var(--muted);
  }
  .mark b{color:var(--bone);font-weight:600;}

  /* ---- 地層バー（時間の配分） ---- */
  .strata-block{margin-bottom:26px;}
  .strata{
    display:flex;width:100%;height:56px;border-radius:10px;overflow:hidden;
    background:var(--panel);gap:2px;
  }
  .strata-seg{
    min-width:2px;transition:flex-grow .6s cubic-bezier(.4,0,.2,1);
    position:relative;
  }
  .strata-seg.is-running::after{
    content:"";position:absolute;inset:0;
    background:linear-gradient(180deg,rgba(255,255,255,.45),rgba(255,255,255,0));
    animation:pulse 2.4s ease-in-out infinite;
  }
  @keyframes pulse{0%,100%{opacity:.15}50%{opacity:.5}}
  .strata-empty{
    height:56px;border-radius:10px;border:1px dashed var(--line);
    display:flex;align-items:center;justify-content:center;
    color:var(--muted);font-size:13px;
  }
  .strata-foot{
    display:flex;justify-content:space-between;align-items:baseline;
    margin-top:10px;
  }
  .strata-foot .lbl{font-size:12px;letter-spacing:.14em;color:var(--muted);}
  .strata-foot .total{
    font-family:var(--mono);font-size:22px;font-weight:600;
    font-variant-numeric:tabular-nums;letter-spacing:-.02em;
  }

  /* ---- 実行中パネル ---- */
  .live{
    border-radius:var(--radius);padding:20px 18px;margin-bottom:24px;
    background:var(--panel);position:relative;overflow:hidden;
    border:1px solid var(--line);
  }
  .live::before{
    content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--hue,#F2A03D);
  }
  .live .now-lbl{
    font-size:12px;letter-spacing:.2em;color:var(--hue,#F2A03D);
    display:flex;align-items:center;gap:7px;margin-bottom:4px;
  }
  .dot{width:7px;height:7px;border-radius:50%;background:var(--hue,#F2A03D);animation:blink 1.6s ease-in-out infinite;}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
  .live .now-name{font-size:17px;font-weight:600;margin-bottom:10px;word-break:break-word;}
  .live .readout{
    font-family:var(--mono);font-variant-numeric:tabular-nums;
    font-size:52px;line-height:1;font-weight:600;letter-spacing:-.035em;
    color:var(--hue,#F2A03D);
    text-shadow:0 0 34px color-mix(in srgb,var(--hue,#F2A03D) 45%,transparent);
    margin-bottom:16px;
  }
  .live .readout .sec{font-size:.62em;opacity:.65;font-weight:400;}

  /* ---- タスク行 ---- */
  .section-lbl{
    font-size:12px;letter-spacing:.18em;color:var(--muted);
    margin:0 0 10px 2px;
  }
  .task{
    display:flex;align-items:center;gap:12px;
    padding:13px 14px;margin-bottom:8px;
    background:var(--panel);border-radius:var(--radius);
    border:1px solid transparent;
  }
  .task.is-running{border-color:var(--hue);background:var(--panel-hi);}
  .task.is-done{opacity:.42;}
  .swatch{width:4px;align-self:stretch;border-radius:2px;background:var(--hue);flex:none;}
  .task-body{flex:1;min-width:0;}
  .task-name{font-size:15px;line-height:1.35;word-break:break-word;}
  .task.is-done .task-name{text-decoration:line-through;}
  .task-time{
    font-family:var(--mono);font-variant-numeric:tabular-nums;
    font-size:13px;color:var(--muted);letter-spacing:.01em;margin-top:2px;
  }
  .task-time .share{color:var(--hue);}

  /* ---- ボタン ---- */
  button{font-family:inherit;font-size:inherit;border:none;cursor:pointer;color:inherit;}
  .btn-run{
    flex:none;width:46px;height:46px;border-radius:50%;
    background:transparent;border:1.5px solid var(--hue);color:var(--hue);
    display:grid;place-items:center;transition:transform .12s ease,background .15s ease;
  }
  .btn-run:active{transform:scale(.9);}
  .btn-run.stop{background:var(--hue);color:var(--ground);}
  .btn-run svg{width:16px;height:16px;fill:currentColor;}
  .btn-more{
    flex:none;width:34px;height:40px;background:transparent;color:var(--muted);
    display:grid;place-items:center;font-size:19px;letter-spacing:.06em;
  }
  .btn-stop-lg{
    width:100%;padding:14px;border-radius:11px;
    background:var(--hue);color:var(--ground);font-weight:700;font-size:15px;
    transition:transform .12s ease;
  }
  .btn-stop-lg:active{transform:scale(.985);}

  /* ---- 追加バー ---- */
  .composer{
    position:fixed;left:0;right:0;bottom:0;
    padding:12px 16px calc(12px + env(safe-area-inset-bottom));
    background:linear-gradient(180deg,rgba(15,30,36,0),var(--ground) 26%);
    display:flex;gap:9px;justify-content:center;
  }
  .composer-inner{display:flex;gap:9px;width:100%;max-width:560px;}
  .composer input{
    flex:1;min-width:0;font-size:16px;font-family:inherit;
    background:var(--panel);border:1px solid var(--line);color:var(--bone);
    border-radius:11px;padding:13px 14px;outline:none;
  }
  .composer input:focus{border-color:var(--muted);}
  .composer input::placeholder{color:var(--muted);}
  .composer button{
    flex:none;padding:0 20px;border-radius:11px;
    background:var(--bone);color:var(--ground);font-weight:700;
  }
  .composer button:disabled{opacity:.3;}

  /* ---- シート ---- */
  .scrim{
    position:fixed;inset:0;background:rgba(6,14,17,.72);
    display:none;align-items:flex-end;justify-content:center;z-index:20;
    backdrop-filter:blur(3px);
  }
  .scrim.open{display:flex;}
  .sheet{
    width:100%;max-width:560px;background:var(--panel);
    border-radius:20px 20px 0 0;padding:22px 18px calc(22px + env(safe-area-inset-bottom));
    animation:rise .26s cubic-bezier(.16,1,.3,1);
  }
  @keyframes rise{from{transform:translateY(100%)}to{transform:translateY(0)}}
  .sheet h2{margin:0 0 3px;font-size:17px;font-weight:600;word-break:break-word;}
  .sheet .sub{
    font-family:var(--mono);font-size:13px;color:var(--muted);margin-bottom:20px;
    font-variant-numeric:tabular-nums;
  }
  .sheet input[type=text]{
    width:100%;font-size:16px;font-family:inherit;margin-bottom:16px;
    background:var(--ground);border:1px solid var(--line);color:var(--bone);
    border-radius:11px;padding:13px 14px;outline:none;
  }
  .adjust-lbl{font-size:12px;letter-spacing:.16em;color:var(--muted);margin-bottom:9px;}
  .adjust{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-bottom:20px;}
  .adjust button{
    padding:11px 0;border-radius:9px;background:var(--ground);
    border:1px solid var(--line);font-family:var(--mono);font-size:13px;
  }
  .adjust button:active{background:var(--panel-hi);}
  .sheet-acts{display:flex;flex-direction:column;gap:8px;}
  .sheet-acts button{
    padding:14px;border-radius:11px;background:var(--ground);
    border:1px solid var(--line);font-size:15px;
  }
  .sheet-acts .primary{background:var(--bone);color:var(--ground);font-weight:700;border-color:var(--bone);}
  .sheet-acts .danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 34%,transparent);}

  .empty{
    text-align:center;padding:44px 20px;color:var(--muted);font-size:14px;line-height:1.9;
  }

  @media (prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important;}
  }
</style>
</head>
<body>

<div class="wrap">
  <div class="masthead">
    <div class="mark"><b>つみあげ</b></div>
    <div class="mark" id="taskCount"></div>
  </div>

  <div class="strata-block">
    <div id="strata"></div>
    <div class="strata-foot">
      <span class="lbl">総計</span>
      <span class="total" id="grandTotal">0:00:00</span>
    </div>
  </div>

  <div id="liveSlot"></div>
  <div id="list"></div>
</div>

<div class="composer">
  <div class="composer-inner">
    <input id="newTask" type="text" placeholder="やりたいことを書く" maxlength="60" enterkeyhint="done">
    <button id="addBtn" disabled>追加</button>
  </div>
</div>

<div class="scrim" id="scrim">
  <div class="sheet" id="sheet"></div>
</div>

<script>
"use strict";

/* ============ 保存 ============
   ホストして使うときは localStorage に保存される（端末内のみ）。
   Claudeのプレビュー内では window.storage を使う。 */
const KEY = "tsumiage:v1";
const Store = {
  async load(){
    try{
      if(window.storage){
        const r = await window.storage.get(KEY);
        return r && r.value ? JSON.parse(r.value) : null;
      }
      const raw = localStorage.getItem(KEY);
      return raw ? JSON.parse(raw) : null;
    }catch(e){ return null; }
  },
  async save(data){
    const json = JSON.stringify(data);
    try{
      if(window.storage){ await window.storage.set(KEY, json); return; }
      localStorage.setItem(KEY, json);
    }catch(e){ /* 保存失敗しても操作は続行できる */ }
  }
};

const HUES = ["#F2A03D","#5FC2A3","#7FA9D6","#D98A7E","#B69AD6","#C9C05E","#6FBFD1","#E39BB8"];

let state = { tasks: [], running: null, hueSeed: 0 };
let tick = null;

/* ============ 時間 ============ */
function elapsedOf(task){
  let ms = task.accumulated;
  if(state.running && state.running.taskId === task.id){
    ms += Date.now() - state.running.startedAt;
  }
  return Math.max(0, ms);
}
function fmt(ms){
  const t = Math.floor(ms/1000);
  const h = Math.floor(t/3600), m = Math.floor(t%3600/60), s = t%60;
  return { h, hm: h + ":" + String(m).padStart(2,"0"), s: String(s).padStart(2,"0") };
}
function fmtFlat(ms){ const f = fmt(ms); return f.hm + ":" + f.s; }
function fmtLoose(ms){
  const t = Math.floor(ms/1000);
  if(t < 60) return t + "秒";
  const h = Math.floor(t/3600), m = Math.floor(t%3600/60);
  return h > 0 ? h + "時間" + m + "分" : m + "分";
}

/* ============ 描画 ============ */
const el = {
  strata: document.getElementById("strata"),
  total: document.getElementById("grandTotal"),
  live: document.getElementById("liveSlot"),
  list: document.getElementById("list"),
  count: document.getElementById("taskCount"),
  input: document.getElementById("newTask"),
  add: document.getElementById("addBtn"),
  scrim: document.getElementById("scrim"),
  sheet: document.getElementById("sheet")
};

function render(){
  const tasks = state.tasks;
  const times = new Map(tasks.map(t => [t.id, elapsedOf(t)]));
  const total = [...times.values()].reduce((a,b) => a+b, 0);

  el.total.textContent = fmtFlat(total);
  const open = tasks.filter(t => !t.done).length;
  el.count.textContent = tasks.length ? open + " / " + tasks.length : "";

  /* 地層バー */
  const tracked = tasks.filter(t => times.get(t.id) > 0);
  if(!tracked.length){
    el.strata.className = "strata-empty";
    el.strata.textContent = "タイマーを回すとここに配分が出ます";
  }else{
    el.strata.className = "strata";
    el.strata.innerHTML = tracked
      .slice().sort((a,b) => times.get(b.id) - times.get(a.id))
      .map(t => {
        const run = state.running && state.running.taskId === t.id;
        return '<div class="strata-seg' + (run ? " is-running" : "") + '" style="flex-grow:' +
          times.get(t.id) + ';background:' + t.hue + '" title="' + esc(t.name) + '"></div>';
      }).join("");
  }

  /* 実行中パネル */
  const cur = state.running ? tasks.find(t => t.id === state.running.taskId) : null;
  if(cur){
    const f = fmt(times.get(cur.id));
    el.live.innerHTML =
      '<div class="live" style="--hue:' + cur.hue + '">' +
        '<div class="now-lbl"><span class="dot"></span>計測中</div>' +
        '<div class="now-name">' + esc(cur.name) + '</div>' +
        '<div class="readout">' + f.hm + '<span class="sec">:' + f.s + '</span></div>' +
        '<button class="btn-stop-lg" data-stop>停止して記録</button>' +
      '</div>';
  }else{
    el.live.innerHTML = "";
  }

  /* 一覧 */
  if(!tasks.length){
    el.list.innerHTML = '<div class="empty">まだ何も登録されていません。<br>下の欄に、いま抱えていることを1つ書いてみてください。</div>';
    return;
  }
  const openTasks = tasks.filter(t => !t.done);
  const doneTasks = tasks.filter(t => t.done);
  let html = "";
  if(openTasks.length) html += openTasks.map(t => row(t, times.get(t.id), total)).join("");
  if(doneTasks.length){
    html += '<div class="section-lbl" style="margin-top:22px">完了</div>';
    html += doneTasks.map(t => row(t, times.get(t.id), total)).join("");
  }
  el.list.innerHTML = html;
}

function row(t, ms, total){
  const run = state.running && state.running.taskId === t.id;
  const share = total > 0 && ms > 0 ? Math.round(ms/total*100) : 0;
  return '<div class="task' + (run ? " is-running" : "") + (t.done ? " is-done" : "") +
      '" style="--hue:' + t.hue + '">' +
    '<div class="swatch"></div>' +
    '<div class="task-body">' +
      '<div class="task-name">' + esc(t.name) + '</div>' +
      '<div class="task-time">' + (ms > 0 ? fmtLoose(ms) : "未着手") +
        (share > 0 ? ' <span class="share">' + share + '%</span>' : "") +
      '</div>' +
    '</div>' +
    '<button class="btn-more" data-more="' + t.id + '" aria-label="操作">···</button>' +
    '<button class="btn-run' + (run ? " stop" : "") + '" data-toggle="' + t.id + '" aria-label="' +
      (run ? "停止" : "開始") + '">' +
      (run
        ? '<svg viewBox="0 0 16 16"><rect x="3" y="3" width="10" height="10" rx="1.5"/></svg>'
        : '<svg viewBox="0 0 16 16"><path d="M4 2.6v10.8a.6.6 0 0 0 .92.5l8.4-5.4a.6.6 0 0 0 0-1L4.92 2.1A.6.6 0 0 0 4 2.6z"/></svg>') +
    '</button>' +
  '</div>';
}

function esc(s){
  return String(s).replace(/[&<>"']/g, c =>
    ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

/* ============ 操作 ============ */
function persist(){ Store.save(state); }

function addTask(name){
  name = name.trim();
  if(!name) return;
  state.tasks.push({
    id: "t" + Date.now().toString(36) + Math.random().toString(36).slice(2,6),
    name,
    hue: HUES[state.hueSeed++ % HUES.length],
    accumulated: 0,
    done: false
  });
  persist(); render();
}

function startTask(id){
  if(state.running) stopTask();          // 同時に走るのは常に1つ
  state.running = { taskId: id, startedAt: Date.now() };
  persist(); render(); startTick();
}

function stopTask(){
  if(!state.running) return;
  const t = state.tasks.find(x => x.id === state.running.taskId);
  if(t) t.accumulated += Date.now() - state.running.startedAt;
  state.running = null;
  persist(); render(); stopTick();
}

function startTick(){ if(!tick) tick = setInterval(render, 1000); }
function stopTick(){ if(tick){ clearInterval(tick); tick = null; } }

/* ============ シート ============ */
let sheetId = null;

function openSheet(id){
  const t = state.tasks.find(x => x.id === id);
  if(!t) return;
  sheetId = id;
  el.sheet.style.setProperty("--hue", t.hue);
  el.sheet.innerHTML =
    '<h2>' + esc(t.name) + '</h2>' +
    '<div class="sub">累計 ' + fmtFlat(elapsedOf(t)) + '</div>' +
    '<input type="text" id="renameField" value="' + esc(t.name) + '" maxlength="60">' +
    '<div class="adjust-lbl">時間を手で直す</div>' +
    '<div class="adjust">' +
      [-30,-10,-1,1,10,30].map(m =>
        '<button data-adj="' + m + '">' + (m>0?"+":"") + m + '</button>').join("") +
    '</div>' +
    '<div class="sheet-acts">' +
      '<button class="primary" data-act="save">保存</button>' +
      '<button data-act="done">' + (t.done ? "未完了に戻す" : "完了にする") + '</button>' +
      '<button class="danger" data-act="delete">削除</button>' +
    '</div>';
  el.scrim.classList.add("open");
}

function closeSheet(){ el.scrim.classList.remove("open"); sheetId = null; }

/* ============ イベント ============ */
el.input.addEventListener("input", () => { el.add.disabled = !el.input.value.trim(); });
el.input.addEventListener("keydown", e => { if(e.key === "Enter") submitNew(); });
el.add.addEventListener("click", submitNew);
function submitNew(){
  addTask(el.input.value);
  el.input.value = "";
  el.add.disabled = true;
  el.input.blur();
}

document.body.addEventListener("click", e => {
  const toggle = e.target.closest("[data-toggle]");
  if(toggle){
    const id = toggle.dataset.toggle;
    if(state.running && state.running.taskId === id) stopTask();
    else startTask(id);
    return;
  }
  if(e.target.closest("[data-stop]")){ stopTask(); return; }
  const more = e.target.closest("[data-more]");
  if(more){ openSheet(more.dataset.more); return; }
});

el.scrim.addEventListener("click", e => {
  if(e.target === el.scrim){ closeSheet(); return; }

  const adj = e.target.closest("[data-adj]");
  if(adj){
    const t = state.tasks.find(x => x.id === sheetId);
    if(!t) return;
    const delta = Number(adj.dataset.adj) * 60000;
    if(state.running && state.running.taskId === t.id){
      state.running.startedAt -= delta;                       // 実行中は開始時刻をずらす
      if(state.running.startedAt > Date.now()) state.running.startedAt = Date.now();
    }else{
      t.accumulated = Math.max(0, t.accumulated + delta);
    }
    el.sheet.querySelector(".sub").textContent = "累計 " + fmtFlat(elapsedOf(t));
    persist(); render();
    return;
  }

  const act = e.target.closest("[data-act]");
  if(!act) return;
  const t = state.tasks.find(x => x.id === sheetId);
  if(!t) return;

  if(act.dataset.act === "save"){
    const v = el.sheet.querySelector("#renameField").value.trim();
    if(v) t.name = v;
    persist(); render(); closeSheet();
  }
  if(act.dataset.act === "done"){
    if(!t.done && state.running && state.running.taskId === t.id) stopTask();
    t.done = !t.done;
    persist(); render(); closeSheet();
  }
  if(act.dataset.act === "delete"){
    if(!confirm("「" + t.name + "」を記録ごと削除します。")) return;
    if(state.running && state.running.taskId === t.id){ state.running = null; stopTick(); }
    state.tasks = state.tasks.filter(x => x.id !== t.id);
    persist(); render(); closeSheet();
  }
});

/* 復帰時に必ず時刻から再計算する（iOSはバックグラウンドでJSが止まるため） */
document.addEventListener("visibilitychange", () => {
  if(document.visibilityState === "visible"){
    render();
    if(state.running) startTick(); else stopTick();
  }else{
    stopTick();
    persist();
  }
});
window.addEventListener("pagehide", persist);

/* ============ 起動 ============ */
(async function boot(){
  const saved = await Store.load();
  if(saved && Array.isArray(saved.tasks)){
    state = Object.assign(state, saved);
    state.hueSeed = state.hueSeed || state.tasks.length;
  }
  render();
  if(state.running) startTick();
})();
</script>
</body>
</html>
